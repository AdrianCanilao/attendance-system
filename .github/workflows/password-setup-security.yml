name: Password setup security checks

on:
  push:
    branches: [test-deployment]
    paths:
      - "attendance-system/backend/password_setup_api.py"
      - "attendance-system/backend/password_setup_status.py"
      - "attendance-system/backend/temporary_passwords.py"
      - "attendance-system/backend/test_password_setup_security.py"
      - "attendance-system/backend/test_temporary_passwords.py"
      - "attendance-system/backend/test_password_setup_rls_migration.py"
      - "attendance-system/supabase/migrations/20261030_password_setup_rls_guard.sql"
      - ".github/workflows/password-setup-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: attendance-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"
      - name: Run password policy and authorization tests
        run: python -m unittest -v backend.test_temporary_passwords backend.test_password_setup_security backend.test_password_setup_rls_migration
